project:
  name: "raw_like_stats_v0_aigibench_handcrafted"
  root: "/data1/xzp/AIGC/raw_like_stats_v0"
  random_seed: 42

data:
  dataset_name: "aigibench"
  aigibench_root: "/data1/xzp/dataset/in-the-wild/AIGIBench"
  manifest_path: "data/manifests/aigibench_handcrafted.csv"
  manifest_summary_path: "outputs/aigibench_handcrafted/manifest_summary.json"
  failed_images_path: "outputs/aigibench_handcrafted/failed_images.csv"
  image_extensions: [".jpg", ".jpeg", ".png", ".webp"]
  max_per_label_per_subset:
  max_per_label_per_subset_by_split:
  aigibench_train_setting: "setting_ii"
  aigibench_train_subsets: ["car", "cat", "chair", "horse", "sdv1.4"]
  aigibench_val_subsets:
  aigibench_test_subsets:
  generator_families:
    car: "progan_train_category"
    cat: "progan_train_category"
    chair: "progan_train_category"
    horse: "progan_train_category"
    sdv1.4: "diffusion_text_to_image"
    ProGAN: "gan_noise_to_image"
    R3GAN: "gan_noise_to_image"
    StyleGAN3: "gan_noise_to_image"
    StyleGAN-XL: "gan_noise_to_image"
    DALLE-3: "diffusion_text_to_image"
    FLUX1-dev: "diffusion_text_to_image"
    GLIDE: "diffusion_text_to_image"
    Imagen3: "diffusion_text_to_image"
    Midjourney: "diffusion_text_to_image"
    SD3: "diffusion_text_to_image"
    SDXL: "diffusion_text_to_image"
    BLIP: "personalized_or_conditioned_generation"
    IP-Adapter: "personalized_or_conditioned_generation"
    Infinite-ID: "personalized_or_conditioned_generation"
    InstantID: "personalized_or_conditioned_generation"
    PhotoMaker: "personalized_or_conditioned_generation"
    BlendFace: "deepfake_face_generation"
    E4S: "deepfake_face_generation"
    FaceSwap: "deepfake_face_generation"
    InSwap: "deepfake_face_generation"
    SimSwap: "deepfake_face_generation"
    StyleSwim: "deepfake_face_generation"
    WFIR: "deepfake_face_generation"
    CommunityAI: "open_platform_or_social"
    SocialRF: "open_platform_or_social"

cycleisp:
  repo_dir: "/data1/xzp/AIGC/CycleISP"
  checkpoint_path: "/data1/xzp/AIGC/CycleISP/pretrained_models/isp/pths/rgb2raw.pth"
  device: "cuda:0"
  batch_size: 4

preprocess:
  image_size: 512
  center_crop: true
  force_rgb: true
  normalize_to_0_1: true

raw_like_output:
  photo_dir: "outputs/aigibench_handcrafted/raw_like/photo"
  gen_dir: "outputs/aigibench_handcrafted/raw_like/gen"
  save_npy: true
  save_preview_png: false
  preview_dir: "outputs/aigibench_handcrafted/raw_like/previews"

features:
  output_csv: "outputs/aigibench_handcrafted/features/raw_like_features.csv"
  output_parquet: "outputs/aigibench_handcrafted/features/raw_like_features.parquet"
  schema_json: "outputs/aigibench_handcrafted/features/feature_schema.json"
  patch_size: 64
  patch_stride: 64
  min_patch_std: 0.005

  noise:
    enabled: true
    num_intensity_bins: 16
    local_window: 8

  highpass:
    enabled: true
    filters: ["laplacian", "sobel_x", "sobel_y", "haar_h", "haar_v"]

  channel:
    enabled: true

  frequency:
    enabled: true
    num_radial_bins: 16

  cfa_like:
    enabled: false

analysis:
  output_dir: "outputs/aigibench_handcrafted/analysis"
  random_seed: 42
  gmm_components: 5

aigibench_eval:
  output_dir: "outputs/aigibench_handcrafted/evaluation"
  random_seed: 42
  threshold_metric: "balanced_accuracy"
  plot_sample_size: 10000
  effect_size_top_k: 50

  logistic_regression:
    max_iter: 2000
    class_weight: "balanced"

  gmm:
    components: 5
    covariance_type: "full"
    reg_covar: 0.00001
    pca_components: 32
